      font-weight: bold;
      background: rgba(0,0,0,.3);

      background-size: cover;
      background-position: center;
      position: relative;
    }

    section::before {
      content: "";

      inset: 0;
      background: rgba(0,0,0,.58);

    }

    .content p {

      margin-bottom: 16px;
      text-shadow: 0 2px 7px #000;
    }
